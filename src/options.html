<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stand Reminder — Settings</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>
  <body>
    <div class="ss-root ss-page">
      <h1 class="ss-page-title">Settings</h1>

      <h2 class="ss-section-label">Active days</h2>
      <div class="ss-group">
        <div class="ss-row">
          <div class="ss-chips" id="days"></div>
        </div>
      </div>

      <h2 class="ss-section-label">Remind me every</h2>
      <div class="ss-group">
        <div class="ss-row">
          <div class="ss-chips" id="intervals"></div>
        </div>
      </div>

      <h2 class="ss-section-label">Activity</h2>
      <div class="ss-group" id="modes">
        <label class="ss-choice">
          <input type="radio" name="activityMode" value="stretch-break" />
          <span><strong>Stretch break</strong><br />Stand up, move, and stretch for 5 minutes.</span>
        </label>
        <label class="ss-choice">
          <input type="radio" name="activityMode" value="standing-desk" />
          <span><strong>Standing desk</strong><br />Raise your desk and work standing for 10 minutes.</span>
        </label>
      </div>

      <p class="ss-saved" id="status" role="status"></p>
    </div>
    <script src="settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
